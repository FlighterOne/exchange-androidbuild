name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: App icon
        run: |
          mkdir -p app/src/main/res/drawable
          curl -fsSL -o app/src/main/res/drawable/ic_launcher.png \
            "https://raw.githubusercontent.com/FlighterOne/exchange-desktopbuild/main/build/icon.png"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exchange-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
